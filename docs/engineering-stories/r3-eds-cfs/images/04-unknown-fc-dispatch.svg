<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="583" viewBox="0 0 1100 583" role="img" aria-labelledby="title desc"><title id="title">04 / An unknown command reached a valid handler</title><desc id="desc">Pinned dispatcher behavior, and a deliberately separate causal control.</desc><defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50c9d9"/></marker><style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif} .heading{font-weight:700;font-size:30px;fill:#f1f7ff} .sub{font-size:16px;fill:#b7cee3} .box-title{font-weight:700;font-size:18px;fill:#f1f7ff} .small{font-size:14px;fill:#b7cee3} .mono{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#f1f7ff} .pill{font-size:13px;font-weight:700;fill:#f1f7ff} .arrow{fill:none;stroke:#50c9d9;stroke-width:3;marker-end:url(#tip)} </style></defs><rect width="1100" height="583" fill="#07162b"/><text x="45" y="49" class="heading">04 / An unknown command reached a valid handler</text><text x="45" y="77" class="sub">Pinned dispatcher behavior, and a deliberately separate causal control.</text><rect x="15" y="132" width="186" height="63" rx="8" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="38" y="158" class="box-title">Host</text><text x="38" y="179" class="small">PassThrough</text><line x1="108" y1="201" x2="108" y2="424" stroke="#5c88ad" stroke-dasharray="7 6" stroke-width="2"/><rect x="228" y="132" width="186" height="63" rx="8" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="251" y="158" class="box-title">ci_lab</text><text x="251" y="179" class="small">UDP ingress</text><line x1="321" y1="201" x2="321" y2="424" stroke="#5c88ad" stroke-dasharray="7 6" stroke-width="2"/><rect x="441" y="132" width="186" height="63" rx="8" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="464" y="158" class="box-title">EdsLib</text><text x="464" y="179" class="small">identify</text><line x1="534" y1="201" x2="534" y2="424" stroke="#5c88ad" stroke-dasharray="7 6" stroke-width="2"/><rect x="654" y="132" width="186" height="63" rx="8" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="677" y="158" class="box-title">Generated</text><text x="677" y="179" class="small">dispatcher</text><line x1="747" y1="201" x2="747" y2="424" stroke="#5c88ad" stroke-dasharray="7 6" stroke-width="2"/><rect x="867" y="132" width="186" height="63" rx="8" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="890" y="158" class="box-title">OF_DEMO</text><text x="890" y="179" class="small">typed handler</text><line x1="960" y1="201" x2="960" y2="424" stroke="#5c88ad" stroke-dasharray="7 6" stroke-width="2"/><path d="M183,242 H246" fill="none" stroke="#50c9d9" stroke-width="2.8" marker-end="url(#tip)"/><text x="191" y="230" class="small">unknown FC 127</text><path d="M396,287 H459" fill="none" stroke="#50c9d9" stroke-width="2.8" marker-end="url(#tip)"/><text x="404" y="275" class="small">command family matched</text><path d="M609,332 H672" fill="none" stroke="#50c9d9" stroke-width="2.8" marker-end="url(#tip)"/><text x="617" y="320" class="small">no matching derivative</text><path d="M822,380 H885" fill="none" stroke="#50c9d9" stroke-width="2.8" marker-end="url(#tip)"/><text x="830" y="368" class="small">position 0 -&gt; enable</text><rect x="41" y="450" width="1016" height="94" rx="13" fill="#26314b" stroke="#f8c16a" stroke-width="1.8"/><text x="64" y="480" class="box-title">Separate disposable causal control</text><text x="64" y="508" class="small">Known FC0 and FC1 still dispatch; unmatched FC127 rejects; genuine non-derived SEND_HK remains valid.</text><text x="64" y="528" class="small">This evidence-only intervention is not the production behavior or an upstream fix.</text></svg>
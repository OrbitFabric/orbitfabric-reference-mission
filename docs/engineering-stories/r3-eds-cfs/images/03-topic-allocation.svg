<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-labelledby="title desc"><title id="title">03 / The telemetry that vanished</title><desc id="desc">One runtime failure exposed a target allocation boundary, not a semantic mismatch.</desc><defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50c9d9"/></marker><style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif} .heading{font-weight:700;font-size:30px;fill:#f1f7ff} .sub{font-size:16px;fill:#b7cee3} .box-title{font-weight:700;font-size:18px;fill:#f1f7ff} .small{font-size:14px;fill:#b7cee3} .mono{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#f1f7ff} .pill{font-size:13px;font-weight:700;fill:#f1f7ff} .arrow{fill:none;stroke:#50c9d9;stroke-width:3;marker-end:url(#tip)} </style></defs><rect width="1100" height="525" fill="#07162b"/><text x="45" y="49" class="heading">03 / The telemetry that vanished</text><text x="45" y="77" class="sub">One runtime failure exposed a target allocation boundary, not a semantic mismatch.</text><rect x="40" y="140" width="325" height="125" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><rect x="50" y="152" width="5" height="101" rx="2" fill="#ff8e90"/><text x="68" y="171" class="box-title">Initial selected-mission binding</text><text x="68" y="198" class="small">STATUS_TLM TopicId = 161</text><text x="68" y="218" class="small">cFE mapping -&gt; MsgId 0x00000000</text><polyline points="368,204 420,204" class="arrow"  style="stroke:#50c9d9;"/><rect x="423" y="151" width="269" height="99" rx="13" fill="#4a263d" stroke="#ff8e90" stroke-width="1.8"/><text x="449" y="188" class="box-title">Software Bus</text><text x="449" y="219" class="small">transmission rejected</text><rect x="40" y="305" width="325" height="121" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><rect x="50" y="317" width="5" height="97" rx="2" fill="#8ce0b4"/><text x="68" y="336" class="box-title">Corrected selected-mission binding</text><text x="68" y="363" class="small">STATUS_TLM TopicId = 416</text><text x="68" y="383" class="small">cFE mapping -&gt; MID 0x0897</text><polyline points="368,365 420,365" class="arrow"  style="stroke:#50c9d9;"/><rect x="423" y="317" width="269" height="100" rx="13" fill="#1c5146" stroke="#8ce0b4" stroke-width="1.8"/><text x="447" y="355" class="box-title">Typed command flow</text><text x="447" y="385" class="small">telemetry decoded true</text><rect x="744" y="140" width="313" height="287" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="768" y="174" class="box-title">Final public ownership</text><text x="768" y="215" class="mono">topic_ref</text><text x="768" y="247" class="mono">CFE_MISSION/</text><text x="768" y="273" class="small">OF_DEMO_STATUS_TLM_TOPICID</text><text x="768" y="330" class="small">Mission selects number</text><text x="768" y="355" class="small">MissionLib and cFE</text><text x="768" y="379" class="small">resolve the MID</text><text x="44" y="478" class="small">The historic 161 -&gt; 416 fix was a diagnostic. Symbolic topic_ref was the final contract.</text></svg>
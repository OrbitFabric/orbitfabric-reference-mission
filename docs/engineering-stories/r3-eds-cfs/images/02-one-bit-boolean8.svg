<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="548" viewBox="0 0 1100 548" role="img" aria-labelledby="title desc"><title id="title">02 / One bit stopped the build</title><desc id="desc">A field-level representation mismatch, localized without changing mission semantics.</desc><defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#147FA5"/></marker><style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif} .heading{font-weight:700;font-size:30px;fill:#1B3557} .sub{font-size:16px;fill:#48637D} .box-title{font-weight:700;font-size:18px;fill:#1B3557} .small{font-size:14px;fill:#48637D} .mono{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#1B3557} .pill{font-size:13px;font-weight:700;fill:#1B3557} .arrow{fill:none;stroke:#147FA5;stroke-width:3;marker-end:url(#tip)} </style></defs><rect width="1100" height="548" fill="#F8FAFD"/><text x="45" y="49" class="heading">02 / One bit stopped the build</text><text x="45" y="77" class="sub">A field-level representation mismatch, localized without changing mission semantics.</text><text x="44" y="120" class="sub">The semantic bool is unchanged. The adapter changes only its EDS representation.</text><rect x="42" y="155" width="487" height="240" rx="13" fill="#FFFFFF" stroke="#CD405B" stroke-width="1.8"/><text x="69" y="193" class="box-title" fill="#CD405B">FIRST ATTEMPT</text><text x="69" y="229" class="mono">standalone payload.enabled</text><text x="69" y="257" class="mono">BASE_TYPES/StatusBit</text><rect x="69" y="280" width="52" height="52" rx="4" fill="#FFE3E8" stroke="#CD405B" stroke-width="1.8"/><text x="88" y="312" class="box-title">1</text><text x="133" y="310" class="small">bit at field level</text><text x="69" y="365" class="small" fill="#CD405B">Native DDS/IDL writer assertion failed</text><rect x="571" y="155" width="487" height="240" rx="13" fill="#FFFFFF" stroke="#168362" stroke-width="1.8"/><text x="598" y="193" class="box-title" fill="#168362">ADAPTER-LOCAL CORRECTION</text><text x="598" y="229" class="mono">BooleanDataType: Boolean8</text><text x="598" y="257" class="mono">BooleanDataEncoding: sizeInBits=8</text><rect x="598" y="283" width="43" height="49" rx="3" fill="#D9F2E7" stroke="#168362" stroke-width="1.8"/><rect x="647" y="283" width="43" height="49" rx="3" fill="#D9F2E7" stroke="#168362" stroke-width="1.8"/><rect x="696" y="283" width="43" height="49" rx="3" fill="#D9F2E7" stroke="#168362" stroke-width="1.8"/><rect x="745" y="283" width="43" height="49" rx="3" fill="#D9F2E7" stroke="#168362" stroke-width="1.8"/><rect x="794" y="283" width="43" height="49" rx="3" fill="#D9F2E7" stroke="#168362" stroke-width="1.8"/><rect x="843" y="283" width="43" height="49" rx="3" fill="#D9F2E7" stroke="#168362" stroke-width="1.8"/><rect x="892" y="283" width="43" height="49" rx="3" fill="#D9F2E7" stroke="#168362" stroke-width="1.8"/><rect x="941" y="283" width="43" height="49" rx="3" fill="#D9F2E7" stroke="#168362" stroke-width="1.8"/><text x="599" y="365" class="small" fill="#168362">Native EDS generation completed</text><polyline points="532,281 567,281" class="arrow"  style="stroke:#147FA5;"/><rect x="42" y="426" width="1016" height="83" rx="13" fill="#EEF4FB" stroke="#97B4D4" stroke-width="1.8"/><text x="70" y="458" class="box-title">Ownership result</text><text x="70" y="486" class="small">Core bool preserved  |  no generic Profile change  |  target representation owns storage width</text></svg>
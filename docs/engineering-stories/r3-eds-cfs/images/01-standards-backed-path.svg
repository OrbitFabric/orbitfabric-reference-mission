<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">01 / The standards-backed path</title><desc id="desc">A bounded cFS native vertical slice, not a generic mission generator.</desc><defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50c9d9"/></marker><style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif} .heading{font-weight:700;font-size:30px;fill:#f1f7ff} .sub{font-size:16px;fill:#b7cee3} .box-title{font-weight:700;font-size:18px;fill:#f1f7ff} .small{font-size:14px;fill:#b7cee3} .mono{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#f1f7ff} .pill{font-size:13px;font-weight:700;fill:#f1f7ff} .arrow{fill:none;stroke:#50c9d9;stroke-width:3;marker-end:url(#tip)} </style></defs><rect width="1100" height="555" fill="#07162b"/><text x="45" y="49" class="heading">01 / The standards-backed path</text><text x="45" y="77" class="sub">A bounded cFS native vertical slice, not a generic mission generator.</text><text x="45" y="118" class="sub">Authority remains distributed. Projection is not native execution.</text><rect x="42" y="151" width="315" height="119" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><rect x="52" y="163" width="5" height="95" rx="2" fill="#50c9d9"/><text x="70" y="182" class="box-title">Mission semantics</text><text x="70" y="209" class="small">Core contract and Integration Input Set</text><text x="70" y="229" class="small">bool, commands, telemetry identity</text><rect x="395" y="151" width="315" height="119" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><rect x="405" y="163" width="5" height="95" rx="2" fill="#f8c16a"/><text x="423" y="182" class="box-title">EDS-cFS adapter</text><text x="423" y="209" class="small">Projection Profile and typed EDS</text><text x="423" y="229" class="small">Boolean8, constraints, topic_ref</text><rect x="748" y="151" width="315" height="119" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><rect x="758" y="163" width="5" height="95" rx="2" fill="#8ce0b4"/><text x="776" y="182" class="box-title">Target materialization</text><text x="776" y="209" class="small">Selected cFS mission + EdsLib</text><text x="776" y="229" class="small">symbol resolution and generated types</text><polyline points="358,211 391,211" class="arrow"  style="stroke:#50c9d9;"/><polyline points="711,211 744,211" class="arrow"  style="stroke:#50c9d9;"/><rect x="42" y="323" width="315" height="126" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><rect x="52" y="335" width="5" height="102" rx="2" fill="#50c9d9"/><text x="70" y="354" class="box-title">Host command</text><text x="70" y="381" class="small">EDS cmd_send through ci_lab</text><text x="70" y="401" class="small">runtime ingress into cFS</text><rect x="395" y="323" width="315" height="126" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><rect x="405" y="335" width="5" height="102" rx="2" fill="#f8c16a"/><text x="423" y="354" class="box-title">Native application</text><text x="423" y="381" class="small">OF_DEMO typed handler</text><text x="423" y="401" class="small">Software Bus + STATUS_TLM</text><rect x="748" y="323" width="315" height="126" rx="13" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><rect x="758" y="335" width="5" height="102" rx="2" fill="#8ce0b4"/><text x="776" y="354" class="box-title">Host telemetry</text><text x="776" y="381" class="small">to_lab and EDS tlm_recv</text><text x="776" y="401" class="small">PayloadEnabled=true observed</text><polyline points="357,386 391,386" class="arrow"  style="stroke:#50c9d9;"/><polyline points="712,386 744,386" class="arrow"  style="stroke:#50c9d9;"/><path d="M904 273 V304 H198 V318" fill="none" stroke="#50c9d9" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#tip)"/><text x="433" y="303" class="small">generated interface consumed at runtime</text><text x="45" y="510" class="mono">P0: EDS materializes  |  P1: native build  |  P2: command/telemetry  |  P3: dispatch characterization</text></svg>
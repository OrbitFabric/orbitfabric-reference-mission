<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">05 / The boundary owns the answer</title><desc id="desc">What the proof showed about semantic, allocation, representation and runtime responsibilities.</desc><defs><marker id="tip" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#50c9d9"/></marker><style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif} .heading{font-weight:700;font-size:30px;fill:#f1f7ff} .sub{font-size:16px;fill:#b7cee3} .box-title{font-weight:700;font-size:18px;fill:#f1f7ff} .small{font-size:14px;fill:#b7cee3} .mono{font-family:DejaVu Sans Mono,monospace;font-size:14px;fill:#f1f7ff} .pill{font-size:13px;font-weight:700;fill:#f1f7ff} .arrow{fill:none;stroke:#50c9d9;stroke-width:3;marker-end:url(#tip)} </style></defs><rect width="1100" height="590" fill="#07162b"/><text x="45" y="49" class="heading">05 / The boundary owns the answer</text><text x="45" y="77" class="sub">What the proof showed about semantic, allocation, representation and runtime responsibilities.</text><rect x="37" y="132" width="1023" height="55" rx="13" fill="#284361" stroke="#5c88ad" stroke-width="1.8"/><text x="58" y="166" class="box-title">Contract question</text><text x="262" y="166" class="box-title">Authority</text><text x="587" y="166" class="box-title">Native check</text><text x="862" y="166" class="box-title">Result</text><rect x="37" y="190" width="1023" height="61" rx="5" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="56" y="226" class="small">What does it mean?</text><text x="262" y="226" class="small">Core semantic contract</text><text x="587" y="226" class="small">Input identity/types</text><text x="862" y="226" class="small">Preserved</text><rect x="37" y="255" width="1023" height="61" rx="5" fill="#172d46" stroke="#5c88ad" stroke-width="1.8"/><text x="56" y="291" class="small">How is it stored?</text><text x="262" y="291" class="small">Adapter EDS realization</text><text x="587" y="291" class="small">B10 1-bit -&gt; Boolean8</text><text x="862" y="291" class="small">Byte aligned</text><rect x="37" y="320" width="1023" height="61" rx="5" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="56" y="356" class="small">Who allocates it?</text><text x="262" y="356" class="small">Selected cFS mission</text><text x="587" y="356" class="small">TopicRef and TopicId/MID</text><text x="862" y="356" class="small">Mission owned</text><rect x="37" y="385" width="1023" height="61" rx="5" fill="#172d46" stroke="#5c88ad" stroke-width="1.8"/><text x="56" y="421" class="small">What actually runs?</text><text x="262" y="421" class="small">EdsLib / native cFS app</text><text x="587" y="421" class="small">P2 command and telemetry</text><text x="862" y="421" class="small">Observed</text><rect x="37" y="450" width="1023" height="61" rx="5" fill="#122740" stroke="#5c88ad" stroke-width="1.8"/><text x="56" y="486" class="small">What is rejected?</text><text x="262" y="486" class="small">Runtime acceptance policy</text><text x="587" y="486" class="small">P2-B range / P3 FC127</text><text x="862" y="486" class="small">Not automatic</text><text x="44" y="548" class="small">Passing projection and passing a native build do not imply all runtime policy constraints are enforced.</text></svg>
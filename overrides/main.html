{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta and page.meta.r2_social_image %}
    <meta property="og:type" content="article">
    <meta property="og:title" content="One Intent, Two Executions | OrbitFabric R2">
    <meta property="og:description" content="One mission intent, an external FlatSat runtime, and honest execution evidence. Offline-verified; physical execution NOT RUN.">
    <meta property="og:image" content="{{ config.site_url.rstrip('/') }}/{{ page.meta.r2_social_image }}">
    <meta property="og:image:width" content="1672">
    <meta property="og:image:height" content="941">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="One Intent, Two Executions | OrbitFabric R2">
    <meta name="twitter:description" content="One mission intent, an external FlatSat runtime, and honest execution evidence.">
    <meta name="twitter:image" content="{{ config.site_url.rstrip('/') }}/{{ page.meta.r2_social_image }}">
  {% endif %}
{% endblock %}

name: R2 G0 Offline Contract Identity Proof

on:
  pull_request:
    paths:
      - "engineering-stories/02-one-intent-two-executions/**"
      - ".github/workflows/r2-g0-offline-proof.yml"
  workflow_dispatch:

env:
  ORBITFABRIC_CORE_REPOSITORY: OrbitFabric/orbitfabric
  ORBITFABRIC_CORE_REF: 760f364875515c4f4ac0675b5545a2ee0ebc22ad

jobs:
  g0-offline-proof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Reference Mission
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact repository-pinned OrbitFabric Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/${ORBITFABRIC_CORE_REPOSITORY}.git@${ORBITFABRIC_CORE_REF}"
          orbitfabric --version

      - name: Run R2 G0 offline proof
        run: |
          ./engineering-stories/02-one-intent-two-executions/reference-project/run_g0.sh

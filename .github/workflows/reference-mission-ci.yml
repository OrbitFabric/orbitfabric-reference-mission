name: Reference Mission CI

on:
  push:
    branches:
      - main
      - "docs/**"
  pull_request:
  workflow_dispatch:

env:
  ORBITFABRIC_CORE_REPOSITORY: OrbitFabric/orbitfabric
  ORBITFABRIC_CORE_REF: 760f364875515c4f4ac0675b5545a2ee0ebc22ad

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Reference Mission
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OrbitFabric Core baseline and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/${ORBITFABRIC_CORE_REPOSITORY}.git@${ORBITFABRIC_CORE_REF}"
          python -m pip install -r requirements-docs.txt

      - name: Check Engineering Stories public artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("engineering-stories")
          private_working_directories = {"publication", "prepublication", "editorial-drafts"}
          prepublication_filenames = {"linkedin-post.md", "cover-asset.md"}
          offenders = [
              str(path)
              for path in root.rglob("*")
              if path.is_file()
              and (
                  any(part.lower() in private_working_directories for part in path.parts)
                  or path.name.lower() in prepublication_filenames
              )
          ]
          assert not offenders, "Prepublication working artifacts found in public repository: " + ", ".join(offenders)
          print("Public Engineering Story artifact boundary: PASS")
          PY

      - name: Show OrbitFabric version
        run: orbitfabric --version

      - name: Prepare generated output directories
        run: |
          mkdir -p generated/reports
          mkdir -p generated/logs

      - name: Lint Reference Mission
        run: orbitfabric lint mission/

      - name: Export Core inspection surfaces
        run: |
          orbitfabric export model-summary mission/ \
            --json generated/reports/model_summary.json
          orbitfabric export mission-snapshot mission/ \
            --json generated/reports/mission_snapshot.json
          orbitfabric export entity-index mission/ \
            --json generated/reports/entity_index.json
          orbitfabric export relationship-manifest mission/ \
            --json generated/reports/relationship_manifest.json
          orbitfabric export dashboard-summary mission/ \
            --json generated/reports/dashboard_summary.json
          orbitfabric export scenario-declaration \
            scenarios/payload_stop_acquisition_verification.yaml \
            --json generated/reports/payload_stop_acquisition_verification_declaration.json

      - name: Verify R1 declared Scenario accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          declaration = json.loads(
              Path("generated/reports/payload_stop_acquisition_verification_declaration.json")
              .read_text(encoding="utf-8")
          )
          assert declaration["kind"] == "orbitfabric.scenario_declaration"
          assert declaration["declaration_version"] == "0.1-candidate"
          assert declaration["result"] == "loaded"
          assert declaration["scenario"]["id"] == "payload_stop_acquisition_verification"
          assert declaration["source"]["scenario_sha256"] == (
              "b19ff6e1cf3c45cdb81e239d30aad97e8b6f037703c06f27102b762e69a1146a"
          )
          assert declaration["atom_count"] == 8
          assert [atom["id"] for atom in declaration["atoms"]] == [
              f"atom-{index:04d}" for index in range(1, 9)
          ]
          assert [atom["kind"] for atom in declaration["atoms"]] == [
              "scenario_metadata",
              "initial_mode",
              "initial_telemetry",
              "command",
              "expect_event",
              "expect_telemetry",
              "expect_payload_lifecycle",
              "expect_scenario_status",
          ]
          PY

      - name: Verify retained R1 Evidence Set
        run: |
          python -m orbitfabric.conformance.evidence_set manifest \
            engineering-stories/01-one-contract-flight-ground/reference-project/evidence/evidence-set.json
          python -m orbitfabric.conformance.evidence_set bundle \
            engineering-stories/01-one-contract-flight-ground/reference-project/evidence/evidence-set.json \
            engineering-stories/01-one-contract-flight-ground/reference-project/evidence

      - name: Run Reference Mission scenarios
        run: |
          orbitfabric sim scenarios/nominal_payload_acquisition.yaml \
            --json generated/reports/nominal_payload_acquisition_report.json \
            --log generated/logs/nominal_payload_acquisition.txt
          orbitfabric sim scenarios/eclipse_low_power_payload_suspension.yaml \
            --json generated/reports/eclipse_low_power_payload_suspension_report.json \
            --log generated/logs/eclipse_low_power_payload_suspension.txt
          orbitfabric sim scenarios/adcs_degraded_pointing_payload_inhibit.yaml \
            --json generated/reports/adcs_degraded_pointing_payload_inhibit_report.json \
            --log generated/logs/adcs_degraded_pointing_payload_inhibit.txt
          orbitfabric sim scenarios/delayed_sband_downlink_backlog_pending.yaml \
            --json generated/reports/delayed_sband_downlink_backlog_pending_report.json \
            --log generated/logs/delayed_sband_downlink_backlog_pending.txt
          orbitfabric sim scenarios/payload_stop_acquisition_verification.yaml \
            --json generated/reports/payload_stop_acquisition_verification_report.json \
            --log generated/logs/payload_stop_acquisition_verification.txt

      - name: Export scenario index and coverage summary
        run: |
          orbitfabric export scenario-run-index \
            --simulation-reports generated/reports \
            --json generated/reports/scenario_run_index.json
          orbitfabric export coverage-summary mission/ \
            --entity-index generated/reports/entity_index.json \
            --relationship-manifest generated/reports/relationship_manifest.json \
            --scenario-run-index generated/reports/scenario_run_index.json \
            --json generated/reports/coverage_summary.json

      - name: Generate contract-facing artifacts
        run: |
          orbitfabric gen docs mission/
          orbitfabric gen data-flow mission/
          orbitfabric gen runtime mission/
          orbitfabric gen ground mission/

      - name: Set repository-aware documentation coordinates
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "ORBITFABRIC_SITE_URL=https://${owner}.github.io/${repo}/"
            echo "ORBITFABRIC_REPO_URL=https://github.com/${GITHUB_REPOSITORY}"
            echo "ORBITFABRIC_REPO_NAME=${GITHUB_REPOSITORY}"
          } >> "$GITHUB_ENV"

      - name: Build tutorial site strictly
        run: mkdocs build --strict

      - name: Validate R3 source evidence and diagrams
        run: python engineering-stories/03-standards-backed-path-to-cfs/reference-project/verify_story.py
